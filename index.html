le())?'':`<button class=\"btn primary\" onclick=\"openAssign('${tid}')\">+ Assign Work</button>`}</div>${grouped.length?grouped.map(s=>`<div class=\"store\"><h3>J${s}</h3>${list.filter(a=>a.store===s).map(a=>itemCard(a,asTech||['gm','dm'].includes(window.parent.facilitiesRole()))).join('')}</div>`).join(''):`<div class=\"empty compact\">No assignments</div>`}</div>`}function renderTech(){if(window.parent.facilitiesRole()==='tech')return renderViewer();const role=window.parent.facilitiesRole(),limited=['gm','dm'].includes(role);const visible=state.techs.filter(t=>!limited||assigned(t.id,date).some(a=>state.stores.some(st=>st.id===String(a.store)&&st.dm==='Jesus')));return `<div class=\"toolbar\"><h1>${limited?'Technicians Assigned to My Stores':'Tech View'}</h1>${dateControls()}</div>${visible.length?visible.map(t=>scheduleFor(t.id,limited)).join(''):'<div class=\"empty\">No technicians scheduled at your stores for this date.</div>'}`}\nfunction taskStoreDropdown(){\n const groups=[...new Set(state.stores.map(s=>s.dm))].sort((a,b)=>a.localeCompare(b));\n const count=st=>state.tasks.filter(t=>t.store===st&&t.status!=='Completed').length;\n return `<div class=\"task-store-wrap\"><button class=\"task-store-trigger\" onclick=\"toggleTaskStoreMenu()\">${taskStore==='all'?'All Stores':'J'+taskStore}<span class=\"chevron\">\u25be</span></button><div class=\"task-store-menu hidden\" id=\"taskStoreMenu\"><button class=\"task-store-choice\" onclick=\"selectTaskStore('all')\">All Stores</button>${groups.map(dm=>`<div class=\"task-store-heading\">${safe(dm)}</div>${state.stores.filter(st=>st.dm===dm).sort((a,b)=>storeNum(a.id)-storeNum(b.id)).map(st=>`<button class=\"task-store-choice indented ${taskStore===st.id?'chosen':''}\" onclick=\"selectTaskStore('${st.id}')\">J${st.id} (${count(st.id)} ${count(st.id)===1?'task':'tasks'})</button>`).join('')}`).join('')}</div></div>`\n}\nfunction toggleTaskStoreMenu(){document.getElementById('taskStoreMenu')?.classList.toggle('hidden')}\n "tasks\" onclick=\"setTab(\\'tasks\\')\">Task View</button>'; $('app').innerHTML=mode==='technician'?renderViewer():tab==='tech'?renderTech():renderTasks()}function setColor(id,v){tech(id).color=v;save();render()}function setName(id,v){if(v.trim())tech(id).name=v.trim();save();render()}function addTech(){const name=prompt('Technician name');if(!name?.trim())return;const colors=['#eb7e7e','#62b6b2','#d7ad58','#9d90e9','#d98fc0'];state.techs.push({id:'t'+Date.now(),name:name.trim(),color:colors[state.techs.length%colors.length]});save();render()}function removeAssignment(id){if(['gm','dm','tech'].includes(window.parent.facilitiesRole()))return;if(!confirm('Remove this assignment from the schedule?'))return;state.assignments=state.assignments.filter(a=>a.id!==id);save();render()}function closeModal(){$('overlay').classList.add('hidden');$('modal').innerHTML=''}function showModal(markup){$('modal').innerHTML=markup;$('overlay').classList.remove('hidden')}$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};function openAssign(tid){if(['gm','dm','tech'].includes(window.parent.facilitiesRole()))return;window.assignTech=tid;const t=tech(tid);showModal(`<div class=\"row between\"><h2>Assign Work</h2><button class=\"btn ghost\" onclick=\"closeModal()\">\u2715</button></div><div class=\"notice\">${niceDate(date)} \u00b7 Select technicians for this work</div><div class=\"notice\"><span class=\"dot\" style=\"background:${t.color}\"></span> Assigning work to <b>${safe(t.name)}</b></div><input type=\"hidden\" id=\"assignTechChecks\" value=\"${tid}\"><div class=\"field\"><label>Restaurant</label><input type=\"hidden\" id=\"assignStore\" value=\"${state.stores[0].id}\"><button type=\"button\" class=\"storepicker\" id=\"assignStoreButton\" onclick=\"toggleStorePicker()\"><span id=\"assignStoreLabel\"></span><span>\u2304</span></button><div id=\"assignStoreMenu\" class=\"storepicker-menu hidden\"></div></div><div class=\"field\"><label>Assign work</label><div class=\"che bel class=\"assign-pm\"><input type=\"checkbox\" data-pm=\"${p}\"><span>${p} PM <span class=\"pm-caption\">${pmStatus(s,p)==='In Progress'?'Continue PM':'Begin PM'}</span></span></label>`).join('')}function showInlineNewTask(){const el=$('inlineNewTask');el.classList.toggle('hidden');if(el.classList.contains('hidden'))return;el.innerHTML=`<div class=\"field\"><label>New task for J${$('assignStore').value}</label><textarea id=\"inlineDesc\" placeholder=\"What needs repair?\"></textarea></div><div class=\"field\"><label>Priority (required)</label><div class=\"row\">${['Low','Medium','High'].map(p=>`<button type=\"button\" class=\"btn grow\" data-inlinepri=\"${p}\" onclick=\"setInlinePriority('${p}')\">${p}</button>`).join('')}</div></div><div class=\"hint\">Facilities Director: photo not required.</div><button class=\"btn primary\" style=\"margin-top:9px\" onclick=\"createInlineTask()\">Add Task to This Schedule</button>`;window.inlinePriority=null}function setInlinePriority(p){window.inlinePriority=p;document.querySelectorAll('[data-inlinepri]').forEach(b=>{b.style.background=b.dataset.inlinepri===p?(p==='High'?'#a83f44':p==='Medium'?'#987a2d':'#3e646b'):'';b.style.borderColor=b.dataset.inlinepri===p?'white':''})}function createInlineTask(){const desc=$('inlineDesc').value.trim(),p=window.inlinePriority;if(!desc||!p){alert('Enter a task and choose its priority.');return}const store=$('assignStore').value,tids=[...document.querySelectorAll('#assignTechChecks input:checked')].map(x=>x.value),id=window.parent.facilitiesCreateTask(store,desc,p.toLowerCase());tids.forEach(tid=>pushAssign({date,tech:tid,store,kind:'task',taskId:id}));save();closeModal();render()}function pushAssign(a){if(state.assignments.some(x=>x.tech===a.tech&&x.date===a.date&&x.store===a.store&&x.kind===a.kind&&(x.kind==='task'?x.taskId===a.taskId:x.kind==='pm'?x.pmType===a.pmType:true)))return false;state.assignments.push({id:state.nextId++,...a});return true}function saveAssignments(tid){const store=$('assignStore').value;const tids=[$('assignTechChecks').value];if(!tids.length){alert('Select at least one technician.');return}let n=0;for(const who of tids){document.querySelectorAll('#assignChoices [data-taskid]:checked').forEach(el=>{n+=pushAssign({date,tech:who,store,kind:'task',taskId:Number(el.dataset.taskid)})?1:0});document.querySelectorAll('#assignChoices [data-pm]:checked').forEach(el=>{n+=pushAssign({date,tech:who,store,kind:'pm',pmType:el.dataset.pm})?1:0})}if(!n){alert('Select work not already assigned to the selected technicians for this date.');return}save();closeModal();render()}\nfunction assignTask(id,tid){if(!tid)return;const t=task(id);pushAssign({date,tech:tid,store:t.store,kind:'task',taskId:id});save();render()}function openNewTask(tid=''){showModal(`<div class=\"row between\"><h2>New Maintenance Request</h2><button class=\"btn ghost\" onclick=\"closeModal()\">\u2715</button></div><div class=\"notice\">Created by Facilities Director from Scheduling. Photo is optional for this role only.</div><div class=\"field\"><label>Restaurant</label><select id=\"newStore\">${storeOptions(state.stores[0].id,false)}</select></div><div class=\"field\"><label>What needs repair?</label><textarea id=\"newDesc\" placeholder=\"Describe the work needed\"></textarea></div><div class=\"field\"><label>Priority (required)</label><div class=\"row\" id=\"priorityBtns\">${['Low','Medium','High'].map(p=>`<button type=\"button\" class=\"btn grow\" data-pri=\"${p}\" onclick=\"choosePriority('${p}')\">${p}</button>`).join('')}</div></div><div class=\"field\"><label>Assign technician (optional)</label><select id=\"newTech\"><option value=\"\">Unassigned</option>${techOptions(tid)}</select></div><div class=\"field\"><label>Photo (optional for Facilities Director)</label><input type=\"file\" id=\"newPhoto\" accept=\"image/*\"></div><button class=\"btn primary\" style=\"width:100%\" onclick=\"saveNewTask()\">Create Request</button>`);window.newPriority=null}function choosePriority(p){window.newPriority=p;document.querySelectorAll('[data-pri]').forEach(b=>{b.style.background=b.dataset.pri===p?(p==='High'?'#a83f44':p==='Medium'?'#987a2d':'#3e646b'):'';b.style.borderColor=b.dataset.pri===p?'white':''})}function saveNewTask(){const desc=$('newDesc').value.trim(),p=window.newPriority;if(!desc||!p){alert('Enter a description and select a priority.');return}const store=$('newStore').value,tid=$('newTech').value,id=state.nextId++;state.tasks.push({id,store,title:desc,priority:p,status:'Open',createdBy:'Facilities Director',photoExempt:true});if(tid)pushAssign({date,tech:tid,store,kind:'task',taskId:id});save();closeModal();render()}render();\n<\/script><\/body><\/html>\n";
